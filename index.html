<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Reports ｜ 财报分析报告库</title>
<style>
  :root{
    --bg:#eef3f8; --card:#ffffff; --ink:#1c2733; --sub:#5b6b7b;
    --blue:#2f6fed; --blue-strong:#1b4fd0; --blue-soft:#e7f0ff;
    --red:#e5533d; --green:#1d9d74; --line:#e3eaf2;
    --shadow:0 4px 18px rgba(31,55,90,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding:24px 16px}
  .wrap{max-width:1020px;margin:0 auto}
  .hero{background:linear-gradient(135deg,#2f6fed,#1b4fd0);color:#fff;border-radius:16px;padding:30px 32px;margin-bottom:22px;box-shadow:var(--shadow)}
  .hero h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  .hero .sub{margin-top:8px;font-size:13.5px;opacity:.92}
  .hero .tagline{margin-top:14px;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:20px;font-size:12px}
  .card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 .num{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .rep{background:#f7fafd;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;transition:.2s}
  .rep:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--blue)}
  .rep .ctg{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;align-self:flex-start}
  .ctg-mid{background:var(--blue-soft);color:var(--blue)}
  .ctg-new{background:#fff4e5;color:#b26a00;margin-left:6px}
  .rep h3{font-size:16px;font-weight:700;margin:10px 0 4px}
  .rep .co{font-size:12.5px;color:var(--sub)}
  .rep .dt{font-size:12px;color:var(--sub);margin-top:6px}
  .rep .desc{font-size:12.5px;color:var(--sub);margin-top:8px;min-height:38px}
  .rep a.link{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:13.5px;text-decoration:none}
  .rep a.link:hover{color:var(--blue-strong);text-decoration:underline}
  .note{font-size:12.5px;color:var(--sub);margin-top:10px}
  .note b{color:var(--ink)}
  .footer{margin-top:8px;font-size:12px;color:#8a99a8;text-align:center;padding:14px 0 4px}
  @media(max-width:520px){.hero h1{font-size:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>📊 Financial Reports ｜ 财报分析报告库</h1>
    <div class="sub">上市公司（中报 / 年报）深度分析报告 · 数据来源：上市公司正式财报 + 券商研报预期（问财口径）</div>
    <div class="tagline">点击下方报告卡片，即可在线查看完整分析报告</div>
  </div>

  <div class="card">
    <h2><span class="num">1</span>最新财报分析报告</h2>
    <div class="grid" id="reportGrid"><!-- 动态渲染 --></div>
  </div>

  <div class="footer">Financial Reports · GitHub Pages 报告库 ｜ 新报告将在此持续更新</div>

</div>

<script>
// ===== 报告清单（新增报告时在此追加一条即可，无需改动页面结构） =====
const REPORTS = [
  {
    company: "澜起科技",
    code: "688008.SH",
    type: "2026年中报",
    date: "2026-09-01",
    url: "lanqi_2026mid_report_20260901.html",
    isNew: true,
    desc: "AI 互连龙头，归母 +72.3% 创新高；同行业对比涵盖兆易创新、聚辰、东芯，并补充毛利率/ROE 维度。"
  },
  {
    company: "鼎龙股份",
    code: "300054.SZ",
    type: "2026年中报",
    date: "2026-08-30",
    url: "dinglong_2026mid_report_20260830.html",
    isNew: false,
    desc: "半导体材料平台型公司，剔除出表业务后的可比口径营收/净利环比分析。"
  }
];

// 渲染
const grid = document.getElementById('reportGrid');
grid.innerHTML = REPORTS.map(r =>
  `<div class="rep">
     <div><span class="ctg ctg-mid">${r.type}</span>${r.isNew ? '<span class="ctg ctg-new">最新</span>' : ''}</div>
     <h3>${r.company}</h3>
     <div class="co">${r.code} · ${r.date}</div>
     <div class="desc">${r.desc}</div>
     <a class="link" href="${r.url}" target="_blank">查看报告 →</a>
   </div>`
).join('');
</script>
</body>
</html>
